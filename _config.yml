# Tower Defense Complete Kit Documentation Configuration

title: "Tower Defense Complete Kit Documentation"

description: "Tower Defense Complete Kit for Unity — a complete tower-defense game in a box: seeded map generation, data-driven towers with upgrades, an exact economy, directed waves, and a campaign with persistent meta-progression."

url: "https://decnet-games.github.io"

baseurl: "/TowerDefenseKit-DOC"

# Just the Docs theme via GitHub Pages remote_theme (Do NOT set 'theme: just-the-docs' as github-pages gem does not bundle it)

remote_theme: "just-the-docs/just-the-docs"

plugins:

  - jekyll-remote-theme

# Navigation & Search

search_enabled: true

search:

  heading_level: 2

  previews: 3

  preview_words_before: 5

  preview_words_after: 10

  rel_url: true

# Header / Aux links

aux_links:

  "DecNet Games GitHub": "https://github.com/DecNet-Games"

heading_anchors: true

# Color scheme & UI

color_scheme: "dark"

# Callouts

callouts:

  note:

    title: "Note"

    color: "blue"

  tip:

    title: "Pro Tip"

    color: "green"

  warning:

    title: "Warning"

    color: "red"

  important:

    title: "Important"

    color: "yellow"

footer_content: "Copyright &copy; 2026 DecNet Games. All rights reserved. Tower Defense Complete Kit is a commercial Unity product by DecNet Games. Support: support@decnetgames.com"
